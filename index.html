<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Dance Party</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene">
    <div class="magic-particles"></div>
    <svg class="skeleton" viewBox="0 0 200 300">
      <!-- Skull with more detail -->
      <g class="skull">
        <circle cx="100" cy="50" r="20" />
        <!-- Eye sockets -->
        <circle cx="93" cy="45" r="5" />
        <circle cx="107" cy="45" r="5" />
        <!-- Nasal cavity -->
        <path d="M98 50 L102 50 L100 55 Z" />
        <!-- Jaw -->
        <path d="M85 60 Q100 70 115 60" />
        <!-- Teeth -->
        <path d="M90 61 v4 M95 62 v4 M100 62.5 v4 M105 62 v4 M110 61 v4" stroke-width="1" />
      </g>
      
      <!-- Neck vertebrae -->
      <path class="neck" d="M100 70 Q95 75 100 80 Q105 85 100 90" />
      
      <!-- Enhanced spine and detailed ribcage -->
      <g class="torso">
        <path class="spine" d="M100 70 Q98 110 100 150" />
        <!-- Vertebrae dots -->
        <circle cx="100" cy="90" r="2" />
        <circle cx="99" cy="100" r="2" />
        <circle cx="98" cy="110" r="2" />
        <circle cx="99" cy="120" r="2" />
        <circle cx="100" cy="130" r="2" />
        
        <!-- Detailed ribcage -->
        <path class="ribs" d="
          M70 90 Q85 88 100 90 Q115 88 130 90
          M68 100 Q85 98 100 100 Q115 98 132 100
          M67 110 Q85 108 100 110 Q115 108 133 110
          M68 120 Q85 118 100 120 Q115 118 132 120
        " />
        
        <!-- Collarbone -->
        <path d="M85 85 Q100 80 115 85" />
      </g>
      
      <!-- Arms with joints -->
      <g class="left-arm">
        <!-- Shoulder joint -->
        <circle cx="80" cy="90" r="3" />
        <!-- Upper arm -->
        <path d="M80 90 L60 120" />
        <!-- Elbow joint -->
        <circle cx="60" cy="120" r="3" />
        <!-- Forearm -->
        <path d="M60 120 L40 160" />
        <!-- Wrist -->
        <circle cx="40" cy="160" r="2" />
        <!-- Hand -->
        <path d="M40 160 L35 165 M40 160 L40 168 M40 160 L45 167" />
      </g>
      
      <g class="right-arm">
        <!-- Shoulder joint -->
        <circle cx="120" cy="90" r="3" />
        <!-- Upper arm -->
        <path d="M120 90 L140 120" />
        <!-- Elbow joint -->
        <circle cx="140" cy="120" r="3" />
        <!-- Forearm -->
        <path d="M140 120 L160 160" />
        <!-- Wrist -->
        <circle cx="160" cy="160" r="2" />
        <!-- Hand -->
        <path d="M160 160 L155 165 M160 160 L160 168 M160 160 L165 167" />
      </g>
      
      <!-- Pelvis -->
      <path class="pelvis" d="M85 150 Q100 140 115 150 Q120 170 100 165 Q80 170 85 150" />
      
      <!-- Legs with joints -->
      <g class="left-leg">
        <!-- Hip joint -->
        <circle cx="90" cy="155" r="3" />
        <!-- Thigh -->
        <path d="M90 155 L80 200" />
        <!-- Knee joint -->
        <circle cx="80" cy="200" r="3" />
        <!-- Shin -->
        <path d="M80 200 L70 250" />
        <!-- Ankle -->
        <circle cx="70" cy="250" r="2" />
        <!-- Foot -->
        <path d="M70 250 L60 250 Q65 255 70 250" />
      </g>
      
      <g class="right-leg">
        <!-- Hip joint -->
        <circle cx="110" cy="155" r="3" />
        <!-- Thigh -->
        <path d="M110 155 L120 200" />
        <!-- Knee joint -->
        <circle cx="120" cy="200" r="3" />
        <!-- Shin -->
        <path d="M120 200 L130 250" />
        <!-- Ankle -->
        <circle cx="130" cy="250" r="2" />
        <!-- Foot -->
        <path d="M130 250 L140 250 Q135 255 130 250" />
      </g>
    </svg>
  </div>

  <button id="playButton" class="play-button">
    <span class="play-icon">▶</span>
    Start the Dance!
  </button>

  <audio id="musicTrack" loop>
    <source src="/Pixelated Paths - Track 2 - Sonauto.wav" type="audio/wav">
  </audio>

  <script type="module" src="main.js"></script>

</body>
</html>
