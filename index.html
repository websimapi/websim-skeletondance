<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Skeleton Dance Party</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene">
    <div class="magic-particles"></div>
    <svg class="skeleton" viewBox="0 0 200 300">
      <!-- Head -->
      <circle class="skull" cx="100" cy="50" r="20" />
      
      <!-- Body -->
      <path class="spine" d="M100 70 L100 150" />
      <path class="ribs" d="M70 90 H130 M70 110 H130 M70 130 H130" />
      
      <!-- Arms -->
      <g class="left-arm">
        <path d="M100 90 L60 120" />
        <path d="M60 120 L40 160" />
      </g>
      <g class="right-arm">
        <path d="M100 90 L140 120" />
        <path d="M140 120 L160 160" />
      </g>
      
      <!-- Legs -->
      <g class="left-leg">
        <path d="M100 150 L80 200" />
        <path d="M80 200 L70 250" />
      </g>
      <g class="right-leg">
        <path d="M100 150 L120 200" />
        <path d="M120 200 L130 250" />
      </g>
    </svg>
  </div>

  <button id="playButton" class="play-button">
    <span class="play-icon">▶</span>
    Start the Dance!
  </button>

  <audio id="musicTrack" loop>
    <source src="/Pixelated Paths - Track 2 - Sonauto.wav" type="audio/wav">
  </audio>

  <script type="module" src="main.js"></script>

</body>
</html>
